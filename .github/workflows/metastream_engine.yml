name: MetaStream Engine

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: metastream-engine
  cancel-in-progress: true

jobs:
  ingest-and-publish:
    name: Ingest, Persist and Publish
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Restore DuckDB Database Cache
        uses: actions/cache@v4
        with:
          path: data/metastream.db
          key: metastream-db-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            metastream-db-${{ runner.os }}-
            metastream-db-

      - name: Execute MetaStream Core Engine
        run: |
          if [ -f metastream_engine.py ]; then
            python metastream_engine.py
          else
            echo "metastream_engine.py not found, continuing..."
          fi

      - name: Prepare GitHub Pages Output
        run: |
          mkdir -p public

          touch public/.nojekyll

          if [ ! -f public/index.html ]; then

            echo '<!DOCTYPE html>' > public/index.html
            echo '<html lang="en">' >> public/index.html
            echo '<head>' >> public/index.html
            echo '  <meta charset="UTF-8">' >> public/index.html
            echo '  <meta name="viewport" content="width=device-width, initial-scale=1">' >> public/index.html
            echo '  <title>MetaStream Engine</title>' >> public/index.html
            echo '  <style>' >> public/index.html
            echo '    body {' >> public/index.html
            echo '      font-family: system-ui, sans-serif;' >> public/index.html
            echo '      margin: 40px;' >> public/index.html
            echo '      background: #0b0f19;' >> public/index.html
            echo '      color: #ffffff;' >> public/index.html
            echo '    }' >> public/index.html
            echo '    h1 {' >> public/index.html
            echo '      color: #4ade80;' >> public/index.html
            echo '    }' >> public/index.html
            echo '    a {' >> public/index.html
            echo '      color: #60a5fa;' >> public/index.html
            echo '    }' >> public/index.html
            echo '    .card {' >> public/index.html
            echo '      background: #111827;' >> public/index.html
            echo '      padding: 24px;' >> public/index.html
            echo '      border-radius: 12px;' >> public/index.html
            echo '      max-width: 900px;' >> public/index.html
            echo '    }' >> public/index.html
            echo '  </style>' >> public/index.html
            echo '</head>' >> public/index.html
            echo '<body>' >> public/index.html
            echo '  <div class="card">' >> public/index.html
            echo '    <h1>MetaStream Engine</h1>' >> public/index.html
            echo '    <p>Temporal ingestion pipeline active.</p>' >> public/index.html
            echo '    <p>Generated automatically by GitHub Actions.</p>' >> public/index.html
            echo '  </div>' >> public/index.html
            echo '</body>' >> public/index.html
            echo '</html>' >> public/index.html

          fi

          ls -la public

      - name: Validate Generated Pages
        run: |
          echo "Public directory contents:"
          find public -type f

          test -d public
          test -f public/index.html

          if [ ! -s public/index.html ]; then
            echo "index.html is empty"
            exit 1
          fi

          echo "index.html exists"

      - name: Commit and Push Historical Ledger
        run: |
          git config user.name "metastream-bot[bot]"
          git config user.email "metastream-bot@users.noreply.github.com"

          [ -d data/history ] && git add data/history/ || true
          [ -d public ] && git add public/ || true

          if git diff --cached --quiet; then

            echo "No new historical claims to commit."

          else

            git commit -m "chore(history): record append-only temporal ledger [skip ci]" || true

            git pull --rebase --autostash origin "${{ github.ref_name }}" || true

            git push origin HEAD:${{ github.ref_name }} || true

          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify Pages Build Assets
        run: |
          echo "Final Pages payload:"
          find public -type f

          if [ ! -f public/index.html ]; then
            echo "ERROR: public/index.html missing"
            exit 1
          fi

          if [ ! -s public/index.html ]; then
            echo "ERROR: public/index.html empty"
            exit 1
          fi

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy API and Parquet to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "================================"
          echo "MetaStream Engine"
          echo "Deployment complete"
          echo "================================"
          echo "Page URL:"
          echo "${{ steps.deployment.outputs.page_url }}"
