name: MetaStream Engine

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: metastream-engine
  cancel-in-progress: true

jobs:
  ingest-and-build:
    name: Ingest, Persist and Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "**/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Restore Database Cache
        uses: actions/cache@v4
        with:
          path: data/metastream.db
          key: metastream-db-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            metastream-db-${{ runner.os }}-
            metastream-db-

      - name: Execute MetaStream Core Engine
        run: |
          mkdir -p data
          if [ -f metastream_engine.py ]; then
            python metastream_engine.py
          else
            echo "metastream_engine.py not found"
          fi

      - name: Create Pages Site
        run: |
          rm -rf public
          mkdir -p public
          touch public/.nojekyll

          cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>MetaStream Engine</title>
          </head>
          <body>
            <h1>MetaStream Engine</h1>
            <p>Temporal ingestion pipeline active.</p>
            <p>Generated by GitHub Actions.</p>
          </body>
          </html>
          EOF

      - name: Validate Pages Payload
        run: |
          set -e
          test -d public
          test -f public/index.html
          test -s public/index.html

          echo "===== PUBLIC CONTENTS ====="
          find public -type f

          echo "===== INDEX SIZE ====="
          wc -c public/index.html

      - name: Commit Historical Ledger
        run: |
          git config user.name "metastream-bot[bot]"
          git config user.email "metastream-bot@users.noreply.github.com"

          [ -d data/history ] && git add data/history || true
          [ -d public ] && git add public || true

          if git diff --cached --quiet; then
            echo "No new historical claims."
          else
            git commit -m "chore(history): record append-only temporal ledger [skip ci]"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy to GitHub Pages
    needs: ingest-and-build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "Deployment Complete"
          echo "URL: ${{ steps.deployment.outputs.page_url }}"
