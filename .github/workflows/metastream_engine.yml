name: MetaStream Engine

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: metastream-engine
  cancel-in-progress: true

jobs:
  ingest-and-publish:
    name: Ingest, Persist and Publish
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Restore DuckDB Database Cache
        uses: actions/cache@v4
        with:
          path: data/metastream.db
          key: metastream-db-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            metastream-db-${{ runner.os }}-
            metastream-db-

      - name: Execute MetaStream Core Engine
        run: |
          python metastream_engine.py

      - name: Prepare GitHub Pages Output
        run: |
          mkdir -p public

          touch public/.nojekyll

          if [ ! -f public/index.html ]; then
            cat > public/index.html <<EOF
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MetaStream Engine</title>
</head>
<body>
<h1>MetaStream Engine</h1>
<p>Temporal ingestion pipeline active.</p>
<p>Generated: $(date -u)</p>
</body>
</html>
EOF
          fi

      - name: Validate Generated Pages
        run: |
          echo "Public directory contents:"
          find public -type f

          test -d public
          test -f public/index.html

      - name: Commit and Push Historical Ledger
        run: |
          git config user.name "metastream-bot[bot]"
          git config user.email "metastream-bot@users.noreply.github.com"

          [ -d data/history ] && git add data/history/
          [ -d public ] && git add public/

          if git diff --cached --quiet; then
            echo "No new historical claims to commit."
          else
            git commit -m "chore(history): record append-only temporal ledger [skip ci]"

            git pull --rebase --autostash origin main || true

            git push origin main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy API and Parquet to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "Deployment complete"
          echo "Page URL:"
          echo "${{ steps.deployment.outputs.page_url }}"
