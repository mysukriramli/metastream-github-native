name: MetaStream Engine

on:
  schedule:
    - cron: '0 * * * *' # Runs hourly
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  ingest-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore DuckDB Database Cache
        uses: actions/cache@v4
        with:
          path: data/metastream.db
          key: metastream-db-${{ github.run_id }}
          restore-keys: |
            metastream-db-

      - name: Execute MetaStream Core Engine (DuckDB)
        run: python metastream_engine.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifacts to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public/'

      - name: Deploy API and Parquet to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
